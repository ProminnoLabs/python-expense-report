[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-report"
version = "0.1.0"
description = "Summarize CSV expenses by category"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
expense-report = "expense_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
